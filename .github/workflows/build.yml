          class GraceReferenceCard extends StatefulWidget {
            const GraceReferenceCard({super.key});
            @override
            State<GraceReferenceCard> createState() => _GraceReferenceCardState();
          }

          class _GraceReferenceCardState extends State<GraceReferenceCard> {
            double age = 65, hr = 85, sbp = 120, creat = 100;
            int killip = 1;
            bool arrest = false, stDev = false, markers = false;

            int _calculateGrace() {
              int pts = 0;
              if (age >= 80) pts += 91; else if (age >= 70) pts += 73; else if (age >= 60) pts += 55; else if (age >= 50) pts += 36; else if (age >= 40) pts += 18;
              if (hr >= 150) pts += 38; else if (hr >= 110) pts += 24; else if (hr >= 90) pts += 15; else if (hr >= 70) pts += 9;
              if (sbp < 80) pts += 58; else if (sbp < 100) pts += 53; else if (sbp < 120) pts += 43; else if (sbp < 140) pts += 34; else if (sbp < 160) pts += 24; else if (sbp < 200) pts += 10;
              if (creat >= 353) pts += 28; else if (creat >= 177) pts += 21; else if (creat >= 106) pts += 10; else if (creat >= 71) pts += 7; else pts += 4;
              if (killip == 2) pts += 20; if (killip == 3) pts += 39; if (killip == 4) pts += 59;
              if (arrest) pts += 39; if (stDev) pts += 28; if (markers) pts += 14;
              return pts;
            }

            @override
            Widget build(BuildContext context) {
              int score = _calculateGrace();
              String risk = score > 140 ? 'Высокий риск (>3%)' : (score >= 109 ? 'Умеренный риск (1–3%)' : 'Низкий риск (<1%)');
              return Card(
                child: ExpansionTile(
                  title: const Text('Шкала GRACE (Летальность при ОКС)'),
                  subtitle: Text('Баллы: $score — $risk'),
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: Column(
                        children: [
                          Text('Возраст: ${age.toInt()} лет'),
                          Slider(value: age, min: 30, max: 95, onChanged: (v) => setState(() => age = v)),
                          Text('ЧСС: ${hr.toInt()} уд/мин'),
                          Slider(value: hr, min: 40, max: 180, onChanged: (v) => setState(() => hr = v)),
                          Text('САД: ${sbp.toInt()} мм рт. ст.'),
                          Slider(value: sbp, min: 60, max: 220, onChanged: (v) => setState(() => sbp = v)),
                          Text('Креатинин: ${creat.toInt()} мкмоль/л'),
                          Slider(value: creat, min: 40, max: 400, onChanged: (v) => setState(() => creat = v)),
                          DropdownButtonFormField<int>(
                            value: killip,
                            decoration: const InputDecoration(labelText: 'Класс Killip'),
                            items: const [
                              DropdownMenuItem(value: 1, child: Text('Killip I — Нет СН')),
                              DropdownMenuItem(value: 2, child: Text('Killip II — Хрипы <50%')),
                              DropdownMenuItem(value: 3, child: Text('Killip III — Отек легких')),
                              DropdownMenuItem(value: 4, child: Text('Killip IV — Кардиогенный шок')),
                            ],
                            onChanged: (v) => setState(() => killip = v!),
                          ),
                          CheckboxListTile(title: const Text('Остановка сердца при поступлении'), value: arrest, onChanged: (v) => setState(() => arrest = v!)),
                          CheckboxListTile(title: const Text('Девиация сегмента ST'), value: stDev, onChanged: (v) => setState(() => stDev = v!)),
                          CheckboxListTile(title: const Text('Повышение тропонина'), value: markers, onChanged: (v) => setState(() => markers = v!)),
                        ],
                      ),
                    )
                  ],
                ),
              );
            }
          }

