name: Auto-Create & Build ICU Diary APK (AQ Key Support)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Project, Inject Code & Build APK
        run: |
          # 1. Создаем чистый Flutter-проект для Android
          flutter create --platforms=android --org com.reanimatologist.diary icu_diary
          cd icu_diary

          # 2. Прописываем разрешения для камеры и интернета в AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA"\/><uses-permission android:name="android.permission.INTERNET"\/><application/' android/app/src/main/AndroidManifest.xml

          # 3. Автоматически создаем pubspec.yaml (с пакетом http для ключей AQ...)
          cat << 'EOF' > pubspec.yaml
          name: icu_diary
          description: Дневник врача-реаниматолога с Gemini AI (поддержка AQ API Key) и клиническими шкалами.
          publish_to: 'none'
          version: 1.0.1+2

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            http: ^1.2.1
            shared_preferences: ^2.2.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # 4. Записываем полный код приложения с поддержкой ключей AQ... в lib/main.dart
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:http/http.dart' as http;
          import 'package:shared_preferences/shared_preferences.dart';

          // Вы можете сразу вписать сюда свой ключ AQ..., чтобы не вводить его в приложении вручную:
          const String defaultAqApiKey = '';

          void main() {
            runApp(const ReanimatologistApp());
          }

          class ReanimatologistApp extends StatelessWidget {
            const ReanimatologistApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Дневник Реаниматолога + Gemini AI',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF005B96),
                    brightness: Brightness.light,
                  ),
                  useMaterial3: true,
                ),
                home: const PatientListScreen(),
              );
            }
          }

          // ============================================================================
          // СЕРВИС ПРЯМОГО ОБРАЩЕНИЯ К GEMINI (ПОДДЕРЖКА КЛЮЧЕЙ AQ... И AIza...)
          // ============================================================================

          class GeminiMedicalService {
            static const String _apiKeyPref = 'gemini_api_key';

            static const String _systemPrompt = '''
          Ты — экспертный ИИ-ассистент врача-анестезиолога-реаниматолога в Республике Беларусь.
          При анализе любых бланков анализов (ОАК, Б/Х, КЩС, коагулограмма, ОАМ) и инструментальных исследований (КТ, УЗИ):
          1. Оценивай показатели строго в контексте интенсивной терапии и реанимации.
          2. Сравнивай новые показатели с предыдущими данными пациента в динамике (указывай тренды: нарастание лактата, динамика ПКТ/СРБ, сдвиги КЩС, динамика креатинина и СКФ, коагулопатия).
          3. Давай полные клинические рекомендации согласно клиническим протоколам МЗ РБ и международным гайдлайнам: указывай конкретные международные непатентованные названия (МНН) лекарственных средств, точные дозировки (мг/кг, мкг/кг/мин), кратность введения, скорость инфузии/титрования и альтернативные препараты выбора с учетом функции почек/печени и массы тела пациента.
          ''';

            static Future<String?> getApiKey() async {
              final prefs = await SharedPreferences.getInstance();
              final saved = prefs.getString(_apiKeyPref);
              if (saved != null && saved.trim().isNotEmpty) {
                return saved.trim();
              }
              if (defaultAqApiKey.trim().isNotEmpty) {
                return defaultAqApiKey.trim();
              }
              return null;
            }

            static Future<void> setApiKey(String key) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString(_apiKeyPref, key.trim());
            }

            /// Универсальный метод отправки запроса к Gemini (поддерживает AQ... Vertex AI и AIza... AI Studio)
            static Future<String> _callGeminiEndpoint({
              required String prompt,
              String? base64Image,
              required bool expectJson,
            }) async {
              final apiKey = await getApiKey();
              if (apiKey == null || apiKey.isEmpty) {
                throw Exception('API-ключ (AQ...) не задан. Нажмите на иконку ключа в верхнем меню.');
              }

              final List> parts = [
                {'text': prompt}
              ];

              if (base64Image != null) {
                parts.add({
                  'inlineData': {
                    'mimeType': 'image/jpeg',
                    'data': base64Image,
                  }
                });
              }

              final Map<String, dynamic> requestBody = {
                'systemInstruction': {
                  'parts': [
                    {'text': _systemPrompt}
                  ]
                },
                'contents': [
                  {
                    'role': 'user',
                    'parts': parts,
                  }
                ],
                'generationConfig': {
                  'temperature': 0.2,
                  if (expectJson) 'responseMimeType': 'application/json',
                }
              };

              // Если ключ начинается с AQ — используем шлюз Vertex AI Express Mode,
              // при этом предусмотрен автоматический фоллбэк на случай прокси-шлюзов
              final bool isAqKey = apiKey.startsWith('AQ');

              final List<Uri> endpoints = isAqKey
                  ? [
                      Uri.parse('https://aiplatform.googleapis.com/v1/publishers/google/models/gemini-2.5-flash:generateContent?key=$apiKey'),
                      Uri.parse('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$apiKey'),
                    ]
                  : [
                      Uri.parse('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$apiKey'),
                      Uri.parse('https://aiplatform.googleapis.com/v1/publishers/google/models/gemini-2.5-flash:generateContent?key=$apiKey'),
                    ];

              String lastError = '';

              for (final url in endpoints) {
                try {
                  final response = await http.post(
                    url,
                    headers: {
                      'Content-Type': 'application/json',
                      'x-goog-api-key': apiKey,
                    },
                    body: jsonEncode(requestBody),
                  );

                  if (response.statusCode == 200) {
                    final decoded = jsonDecode(utf8.decode(response.bodyBytes));
                    final candidates = decoded['candidates'] as List?;
                    if (candidates != null && candidates.isNotEmpty) {
                      final contentParts = candidates[0]['content']['parts'] as List;
                      return contentParts[0]['text'].toString();
                    }
                  } else {
                    lastError = 'HTTP ${response.statusCode}: ${utf8.decode(response.bodyBytes)}';
                  }
                } catch (e) {
                  lastError = e.toString();
                }
              }

              throw Exception('Не удалось выполнить запрос с ключом: $lastError');
            }

            static Future> analyzeMedicalPhoto({
              required File imageFile,
              required Patient patient,
              required String category,
            }) async {
              final sameCategoryHistory = patient.records
                  .where((r) => r.category == category)
                  .map((r) => 'Дата: ${r.dateOnForm}\nДанные: ${r.extractedData}')
                  .join('\n---\n');

              final otherRecentRecords = patient.records
                  .where((r) => r.category != category)
                  .take(5)
                  .map((r) => '[${r.category} от ${r.dateOnForm}]: ${r.extractedData}')
                  .join('\n');

              final age = DateTime.now().year - patient.birthYear;
              final imageBytes = await imageFile.readAsBytes();
              final base64Image = base64Encode(imageBytes);

              final prompt = '''
          Проанализируй фотографию медицинского бланка категории: "$category".

          ДАННЫЕ ПАЦИЕНТА ОРИТ:
          - Пол: ${patient.gender}, Возраст: $age лет (${patient.birthYear} г.р.)
          - Рост: ${patient.heightCm} см, Фактический вес: ${patient.weightKg} кг
          - ИМТ: ${patient.bmi.toStringAsFixed(1)} кг/м², Идеальная масса тела (IBW): ${patient.idealBodyWeight.toStringAsFixed(1)} кг

          ПРЕДЫДУЩИЕ ИССЛЕДОВАНИЯ ЭТОЙ ЖЕ КАТЕГОРИИ ($category) ДЛЯ ОЦЕНКИ ДИНАМИКИ:
          ${sameCategoryHistory.isEmpty ? 'Предыдущих бланков этой категории нет (первичное внесение).' : sameCategoryHistory}

          ДРУГИЕ НЕДАВНИЕ ДАННЫЕ ПАЦИЕНТА:
          ${otherRecentRecords.isEmpty ? 'Нет данных.' : otherRecentRecords}

          Верни JSON строго со следующей структурой:
          {
            "date": "Дата анализа с бланка в формате ДД.ММ.ГГГГ (если на бланке не видна дата, укажи сегодняшнюю)",
            "extracted_data": "Полная и точная расшифровка всех цифр, показателей и текста заключения с фотографии с единицами измерения",
            "dynamic_and_recommendations": "1) Сравнение с предыдущими анализами по пунктам (динамика).\n2) Патофизиологическая интерпретация (КЩС, электролиты, органная дисфункция).\n3) Рекомендации по коррекции и лечению с указанием препаратов, точных дозировок (в пересчете на ${patient.weightKg} кг / IBW ${patient.idealBodyWeight.toStringAsFixed(1)} кг), кратности введения и альтернативных вариантов терапии."
          }
          ''';

              final rawText = await _callGeminiEndpoint(
                prompt: prompt,
                base64Image: base64Image,
                expectJson: true,
              );

              final cleanedJson = rawText
                  .replaceAll('```json', '')
                  .replaceAll('```', '')
                  .trim();

              return jsonDecode(cleanedJson) as Map<String, dynamic>;
            }

            static Future<String> askConsilium({
              required Patient patient,
              required String doctorQuestion,
            }) async {
              final age = DateTime.now().year - patient.birthYear;
              final allHistory = patient.records
                  .map((r) => '=== ${r.category} (от ${r.dateOnForm}) ===\nПоказатели: ${r.extractedData}\nВыводы: ${r.aiRecommendation}')
                  .join('\n\n');

              final prompt = '''
          Пациент ОРИТ: ${patient.fullName}, Пол: ${patient.gender}, Возраст: $age лет.
          Рост: ${patient.heightCm} см, Вес: ${patient.weightKg} кг (Идеальная масса тела IBW: ${patient.idealBodyWeight.toStringAsFixed(1)} кг, ИМТ: ${patient.bmi.toStringAsFixed(1)}).

          Полный дневник анализов и обследований пациента:
          ${allHistory.isEmpty ? 'Анализы еще не внесены.' : allHistory}

          Вопрос лечащего врача-реаниматолога:
          "$doctorQuestion"

          Дай четкий, структурированный ответ с препаратами, расчетом дозировок на вес пациента, кратностью введения и альтернативами.
          ''';

              return await _callGeminiEndpoint(
                prompt: prompt,
                expectJson: false,
              );
            }
          }

          class MedicalRecord {
            final String id;
            final String category;
            final String dateOnForm;
            final String extractedData;
            final String aiRecommendation;

            MedicalRecord({
              required this.id,
              required this.category,
              required this.dateOnForm,
              required this.extractedData,
              required this.aiRecommendation,
            });

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'category': category,
                  'dateOnForm': dateOnForm,
                  'extractedData': extractedData,
                  'aiRecommendation': aiRecommendation,
                };

            factory MedicalRecord.fromJson(Map<String, dynamic> json) => MedicalRecord(
                  id: json['id'],
                  category: json['category'],
                  dateOnForm: json['dateOnForm'],
                  extractedData: json['extractedData'],
                  aiRecommendation: json['aiRecommendation'],
                );
          }

          class Patient {
            String id;
            String fullName;
            String gender;
            int birthYear;
            double heightCm;
            double weightKg;
            List<MedicalRecord> records;

            Patient({
              required this.id,
              required this.fullName,
              required this.gender,
              required this.birthYear,
              required this.heightCm,
              required this.weightKg,
              List<MedicalRecord>? records,
            }) : records = records ?? [];

            double get bmi => heightCm > 0 ? weightKg / ((heightCm / 100) * (heightCm / 100)) : 0;

            double get idealBodyWeight {
              if (heightCm <= 0) return 0;
              double base = gender == 'М' ? 50.0 : 45.5;
              return base + 0.91 * (heightCm - 152.4);
            }

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'fullName': fullName,
                  'gender': gender,
                  'birthYear': birthYear,
                  'heightCm': heightCm,
                  'weightKg': weightKg,
                  'records': records.map((r) => r.toJson()).toList(),
                };

            factory Patient.fromJson(Map<String, dynamic> json) => Patient(
                  id: json['id'],
                  fullName: json['fullName'],
                  gender: json['gender'],
                  birthYear: json['birthYear'],
                  heightCm: (json['heightCm'] as num).toDouble(),
                  weightKg: (json['weightKg'] as num).toDouble(),
                  records: (json['records'] as List)
                      .map((r) => MedicalRecord.fromJson(r))
                      .toList(),
                );
          }

          class PatientListScreen extends StatefulWidget {
            const PatientListScreen({super.key});

            @override
            State<PatientListScreen> createState() => _PatientListScreenState();
          }

          class _PatientListScreenState extends State<PatientListScreen> {
            List<Patient> patients = [];
            bool _hasKey = false;

            @override
            void initState() {
              super.initState();
              _loadPatients();
              _checkApiKey();
            }

            Future<void> _checkApiKey() async {
              final key = await GeminiMedicalService.getApiKey();
              setState(() {
                _hasKey = key != null && key.isNotEmpty;
              });
            }

            Future<void> _loadPatients() async {
              final prefs = await SharedPreferences.getInstance();
              final String? data = prefs.getString('icu_patients');
              if (data != null) {
                final List decoded = jsonDecode(data);
                setState(() {
                  patients = decoded.map((e) => Patient.fromJson(e)).toList();
                });
              }
            }

            Future<void> _savePatients() async {
              final prefs = await SharedPreferences.getInstance();
              final String encoded = jsonEncode(patients.map((p) => p.toJson()).toList());
              await prefs.setString('icu_patients', encoded);
            }

            Future<void> _showApiKeyDialog() async {
              final currentKey = await GeminiMedicalService.getApiKey() ?? '';
              final keyCtrl = TextEditingController(text: currentKey);

              if (!mounted) return;
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Row(
                    children: [
                      Icon(Icons.vpn_key, color: Colors.blue),
                      SizedBox(width: 8),
                      Text('Ключ Gemini API (AQ...)'),
                    ],
                  ),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Text(
                        'Вставьте ваш API-ключ, начинающийся на AQ... (Vertex AI / Google Cloud) или AIza...:',
                        style: TextStyle(fontSize: 13),
                      ),
                      const SizedBox(height: 12),
                      TextField(
                        controller: keyCtrl,
                        decoration: const InputDecoration(
                          labelText: 'AQ...',
                          hintText: 'AQ.Ab8RN6...',
                          border: OutlineInputBorder(),
                        ),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx),
                      child: const Text('Отмена'),
                    ),
                    ElevatedButton(
                      onPressed: () async {
                        await GeminiMedicalService.setApiKey(keyCtrl.text);
                        await _checkApiKey();
                        if (ctx.mounted) Navigator.pop(ctx);
                        if (mounted) {
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(content: Text('Ключ AQ успешно сохранен!')),
                          );
                        }
                      },
                      child: const Text('Сохранить'),
                    ),
                  ],
                ),
              );
            }

            void _showAddPatientDialog() {
              final nameCtrl = TextEditingController();
              final yearCtrl = TextEditingController();
              final heightCtrl = TextEditingController();
              final weightCtrl = TextEditingController();
              String gender = 'М';

              showDialog(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (context, setDialogState) => AlertDialog(
                    title: const Text('Новый пациент ОРИТ'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(
                            controller: nameCtrl,
                            decoration: const InputDecoration(labelText: 'ФИО / Номер койки'),
                          ),
                          const SizedBox(height: 8),
                          DropdownButtonFormField<String>(
                            value: gender,
                            decoration: const InputDecoration(labelText: 'Пол'),
                            items: const [
                              DropdownMenuItem(value: 'М', child: Text('Мужской')),
                              DropdownMenuItem(value: 'Ж', child: Text('Женский')),
                            ],
                            onChanged: (val) => setDialogState(() => gender = val!),
                          ),
                          TextField(
                            controller: yearCtrl,
                            keyboardType: TextInputType.number,
                            decoration: const InputDecoration(labelText: 'Год рождения (напр. 1965)'),
                          ),
                          TextField(
                            controller: heightCtrl,
                            keyboardType: TextInputType.number,
                            decoration: const InputDecoration(labelText: 'Рост (см)'),
                          ),
                          TextField(
                            controller: weightCtrl,
                            keyboardType: TextInputType.number,
                            decoration: const InputDecoration(labelText: 'Вес (кг)'),
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.pop(ctx),
                        child: const Text('Отмена'),
                      ),
                      ElevatedButton(
                        onPressed: () {
                          if (nameCtrl.text.isEmpty) return;
                          final newPatient = Patient(
                            id: DateTime.now().millisecondsSinceEpoch.toString(),
                            fullName: nameCtrl.text,
                            gender: gender,
                            birthYear: int.tryParse(yearCtrl.text) ?? 1970,
                            heightCm: double.tryParse(heightCtrl.text) ?? 170,
                            weightKg: double.tryParse(weightCtrl.text) ?? 70,
                          );
                          setState(() => patients.add(newPatient));
                          _savePatients();
                          Navigator.pop(ctx);
                        },
                        child: const Text('Добавить'),
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Дневник Реаниматолога'),
                  backgroundColor: Theme.of(context).colorScheme.primaryContainer,
                  actions: [
                    IconButton(
                      tooltip: 'Настроить ключ Gemini API (AQ...)',
                      icon: Icon(
                        Icons.vpn_key,
                        color: _hasKey ? Colors.green.shade800 : Colors.red,
                      ),
                      onPressed: _showApiKeyDialog,
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    if (!_hasKey)
                      MaterialBanner(
                        backgroundColor: Colors.amber.shade100,
                        content: const Text(
                          'Для работы ИИ-анализа бланков укажите ваш API-ключ AQ... (иконка ключа вверху).',
                          style: TextStyle(fontSize: 13),
                        ),
                        actions: [
                          TextButton(
                            onPressed: _showApiKeyDialog,
                            child: const Text('Ввести ключ AQ'),
                          ),
                        ],
                      ),
                    Expanded(
                      child: patients.isEmpty
                          ? const Center(
                              child: Text(
                                'Список пациентов пуст.\nНажмите «+ Пациент», чтобы добавить карточку.',
                                textAlign: TextAlign.center,
                                style: TextStyle(fontSize: 16, color: Colors.grey),
                              ),
                            )
                          : ListView.builder(
                              padding: const EdgeInsets.all(8),
                              itemCount: patients.length,
                              itemBuilder: (ctx, i) {
                                final p = patients[i];
                                final age = DateTime.now().year - p.birthYear;
                                return Card(
                                  elevation: 2,
                                  child: ListTile(
                                    leading: CircleAvatar(
                                      backgroundColor:
                                          p.gender == 'М' ? Colors.blue.shade100 : Colors.pink.shade100,
                                      child: Text(p.gender, style: const TextStyle(fontWeight: FontWeight.bold)),
                                    ),
                                    title: Text(p.fullName, style: const TextStyle(fontWeight: FontWeight.bold)),
                                    subtitle: Text(
                                      '$age лет (${p.birthYear} г.р.) | Рост: ${p.heightCm.toInt()} см, Вес: ${p.weightKg} кг\n'
                                      'ИМТ: ${p.bmi.toStringAsFixed(1)} | IBW: ${p.idealBodyWeight.toStringAsFixed(1)} кг\n'
                                      'Анализов в дневнике: ${p.records.length}',
                                    ),
                                    isThreeLine: true,
                                    trailing: IconButton(
                                      icon: const Icon(Icons.delete_outline, color: Colors.red),
                                      onPressed: () {
                                        setState(() => patients.removeAt(i));
                                        _savePatients();
                                      },
                                    ),
                                    onTap: () async {
                                      await Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) => PatientDetailScreen(
                                            patient: p,
                                            onUpdate: _savePatients,
                                          ),
                                        ),
                                      );
                                      setState(() {});
                                    },
                                  ),
                                );
                              },
                            ),
                    ),
                  ],
                ),
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: _showAddPatientDialog,
                  icon: const Icon(Icons.person_add),
                  label: const Text('Пациент'),
                ),
              );
            }
          }

          class PatientDetailScreen extends StatefulWidget {
            final Patient patient;
            final VoidCallback onUpdate;

            const PatientDetailScreen({
              super.key,
              required this.patient,
              required this.onUpdate,
            });

            @override
            State<PatientDetailScreen> createState() => _PatientDetailScreenState();
          }

          class _PatientDetailScreenState extends State<PatientDetailScreen> {
            bool _isAnalyzing = false;
            final ImagePicker _picker = ImagePicker();

            final List<String> _categories = [
              'Общий анализ крови (ОАК)',
              'Биохимия крови (Б/Х)',
              'КЩС и газы крови',
              'Коагулограмма',
              'Общий анализ мочи (ОАМ)',
              'Заключение КТ',
              'Заключение УЗИ',
            ];

            Future<void> _scanAndAnalyzeDocument(String category, ImageSource source) async {
              final XFile? photo = await _picker.pickImage(source: source, imageQuality: 85);
              if (photo == null) return;

              setState(() => _isAnalyzing = true);

              try {
                final result = await GeminiMedicalService.analyzeMedicalPhoto(
                  imageFile: File(photo.path),
                  patient: widget.patient,
                  category: category,
                );

                final newRecord = MedicalRecord(
                  id: DateTime.now().millisecondsSinceEpoch.toString(),
                  category: category,
                  dateOnForm: result['date']?.toString() ?? 'Не определена',
                  extractedData: result['extracted_data']?.toString() ?? 'Нет данных',
                  aiRecommendation: result['dynamic_and_recommendations']?.toString() ?? 'Нет рекомендаций',
                );

                setState(() {
                  widget.patient.records.insert(0, newRecord);
                });
                widget.onUpdate();
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(
                      backgroundColor: Colors.red.shade700,
                      content: Text('Ошибка обращения к Gemini: $e'),
                    ),
                  );
                }
              } finally {
                setState(() => _isAnalyzing = false);
              }
            }

