            void _showGeminiConsiliumSheet() {
              final questionCtrl = TextEditingController();
              String aiAnswer = '';
              bool loading = false;

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) => StatefulBuilder(
                  builder: (context, setModalState) => Padding(
                    padding: EdgeInsets.only(
                      left: 16,
                      right: 16,
                      top: 16,
                      bottom: MediaQuery.of(context).viewInsets.bottom + 16,
                    ),
                    child: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          const Row(
                            children: [
                              Icon(Icons.psychology, color: Colors.deepPurple),
                              SizedBox(width: 8),
                              Text(
                                'ИИ-Консилиум Gemini по пациенту',
                                style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
                              ),
                            ],
                          ),
                          const SizedBox(height: 8),
                          const Text(
                            'Gemini учитывает рост, вес, возраст и все загруженные бланки анализов этого пациента.',
                            style: TextStyle(fontSize: 12, color: Colors.grey),
                          ),
                          const SizedBox(height: 12),
                          TextField(
                            controller: questionCtrl,
                            maxLines: 3,
                            decoration: const InputDecoration(
                              hintText: 'Задайте вопрос по коррекции терапии, дозировкам или инфузии...',
                              border: OutlineInputBorder(),
                            ),
                          ),
                          const SizedBox(height: 12),
                          ElevatedButton.icon(
                            icon: loading
                                ? const SizedBox(
                                    width: 18,
                                    height: 18,
                                    child: CircularProgressIndicator(strokeWidth: 2),
                                  )
                                : const Icon(Icons.send),
                            label: Text(loading ? 'Gemini анализирует...' : 'Спросить Gemini'),
                            onPressed: loading
                                ? null
                                : () async {
                                    if (questionCtrl.text.trim().isEmpty) return;
                                    setModalState(() => loading = true);
                                    try {
                                      final ans = await GeminiMedicalService.askConsilium(
                                        patient: widget.patient,
                                        doctorQuestion: questionCtrl.text,
                                      );
                                      setModalState(() => aiAnswer = ans);
                                    } catch (e) {
                                      setModalState(() => aiAnswer = 'Ошибка: $e');
