            @override
            State<GcsCalculatorCard> createState() => _GcsCalculatorCardState();
          }

          class _GcsCalculatorCardState extends State<GcsCalculatorCard> {
            int eye = 4, verbal = 5, motor = 6;
            String _interpret(int total) {
              if (total == 15) return 'Ясное сознание';
              if (total >= 13) return 'Умеренное оглушение';
              if (total >= 11) return 'Глубокое оглушение';
              if (total >= 9) return 'Сопор';
              if (total >= 6) return 'Умеренная кома (Кома I)';
              if (total >= 4) return 'Глубокая кома (Кома II)';
              return 'Запредельная / терминальная кома (Кома III)';
            }

            @override
            Widget build(BuildContext context) {
              int total = eye + verbal + motor;
              return Card(
                child: ExpansionTile(
                  title: const Text('Шкала комы Глазго (GCS)'),
                  subtitle: Text('Итог: $total б. — ${_interpret(total)}'),
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: Column(
                        children: [
                          DropdownButtonFormField<int>(
                            value: eye,
                            decoration: const InputDecoration(labelText: 'Открывание глаз (E)'),
                            items: const [
                              DropdownMenuItem(value: 4, child: Text('4 — Произвольное')),
                              DropdownMenuItem(value: 3, child: Text('3 — На обращенную речь')),
                              DropdownMenuItem(value: 2, child: Text('2 — На болевой стимул')),
                              DropdownMenuItem(value: 1, child: Text('1 — Отсутствует')),
                            ],
                            onChanged: (v) => setState(() => eye = v!),
                          ),
                          DropdownButtonFormField<int>(
                            value: verbal,
                            decoration: const InputDecoration(labelText: 'Речевая реакция (V)'),
                            items: const [
                              DropdownMenuItem(value: 5, child: Text('5 — Ориентирован, быстрый ответ')),
                              DropdownMenuItem(value: 4, child: Text('4 — Спутанная речь')),
                              DropdownMenuItem(value: 3, child: Text('3 — Отдельные неадекватные слова')),
                              DropdownMenuItem(value: 2, child: Text('2 — Нечленораздельные звуки')),
                              DropdownMenuItem(value: 1, child: Text('1 — Отсутствует / Интубирован (V1/T)')),
                            ],
                            onChanged: (v) => setState(() => verbal = v!),
                          ),
                          DropdownButtonFormField<int>(
                            value: motor,
                            decoration: const InputDecoration(labelText: 'Двигательная реакция (M)'),
                            items: const [
                              DropdownMenuItem(value: 6, child: Text('6 — Выполнение команд')),
                              DropdownMenuItem(value: 5, child: Text('5 — Локализация боли')),
                              DropdownMenuItem(value: 4, child: Text('4 — Отдергивание конечности')),
                              DropdownMenuItem(value: 3, child: Text('3 — Патологическое сгибание (декортикация)')),
                              DropdownMenuItem(value: 2, child: Text('2 — Патологическое разгибание (децеребрация)')),
                              DropdownMenuItem(value: 1, child: Text('1 — Отсутствует')),
                            ],
                            onChanged: (v) => setState(() => motor = v!),
                          ),
                        ],
                      ),
                    )
                  ],
                ),
              );
            }
          }

