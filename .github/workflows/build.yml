          class WellsPeCalculatorCard extends StatefulWidget {
            const WellsPeCalculatorCard({super.key});
            @override
            State<WellsPeCalculatorCard> createState() => _WellsPeCalculatorCardState();
          }

          class _WellsPeCalculatorCardState extends State<WellsPeCalculatorCard> {
            final Map<String, double> criteria = {
              'Клинические признаки ТГВ': 3.0,
              'Альтернативный диагноз менее вероятен, чем ТЭЛА': 3.0,
              'Тахикардия (ЧСС > 100 уд/мин)': 1.5,
              'Иммобилизация ≥3 дней или операция за последние 4 нед.': 1.5,
              'ТГВ или ТЭЛА в анамнезе': 1.5,
              'Кровохарканье': 1.0,
              'Активное онкологическое заболевание': 1.0,
            };
            final Set<String> selected = {};

            @override
            Widget build(BuildContext context) {
              double score = selected.fold(0.0, (sum, key) => sum + criteria[key]!);
              String risk = score > 6 ? 'Высокий риск ТЭЛА' : (score >= 2 ? 'Умеренный риск' : 'Низкий риск');
              return Card(
                child: ExpansionTile(
                  title: const Text('Шкала Уэллса (Wells) для ТЭЛА'),
                  subtitle: Text('Баллы: $score — $risk'),
                  children: criteria.entries
                      .map((e) => CheckboxListTile(
                            title: Text(e.key),
                            subtitle: Text('+${e.value} б.'),
                            value: selected.contains(e.key),
                            onChanged: (val) => setState(() => val! ? selected.add(e.key) : selected.remove(e.key)),
                          ))
